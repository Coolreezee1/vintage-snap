<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vintage Snap — Photobooth</title>
<meta name="description" content="A vintage-style photobooth. Strike a pose, print your strip, share it instantly.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
</head>
<body>
<div class="wrap">

  <div class="marquee">
    <div class="bulb-row">
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span>
    </div>
    <h1 id="brandTitle">The Vintage Snap</h1>
    <p class="tag" id="brandTagline">Capture Today · Cherish Forever</p>
  </div>

  <div class="booth">
    <div class="booth-header">
      <span id="statusLine">CAMERA OFF</span>
      <span class="rec" id="recIndicator" style="visibility:hidden;"><span class="dot"></span> CAPTURING</span>
    </div>

    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <div class="placeholder" id="placeholder">
        Allow camera access to see yourself here.<br>Nothing is uploaded — every photo stays on your device.
      </div>
      <div class="countdown" id="countdown" style="display:none;"></div>
      <div class="flash" id="flash"></div>
      <div class="shot-counter" id="shotCounter" style="display:none;"></div>
    </div>

    <div class="controls-row">
      <div class="controls-left">
        <div class="opt-group" id="shotCountGroup">
          <label class="opt-title">Shots</label>
          <div class="opt-pills" id="shotPills"></div>
        </div>
        <div class="opt-group" id="filterGroup">
          <label class="opt-title">Filter</label>
          <div class="opt-pills" id="filterPills"></div>
        </div>
      </div>
      <div class="controls-right">
        <button class="btn btn-ghost btn-sm" id="switchCamBtn" style="display:none;">Flip camera</button>
        <button class="btn btn-primary" id="startBtn">Turn on camera</button>
        <button class="btn btn-primary" id="captureBtn" style="display:none;">Start photos</button>
      </div>
    </div>
  </div>

  <div class="strip-slot" id="stripSlot" style="display:none;">
    <div class="slot-mouth"></div>
    <div class="slot-label">your strip</div>
    <div id="stripCanvasWrap"></div>
    <div class="share-row">
      <button class="btn btn-primary" id="downloadBtn">Download</button>
      <button class="btn btn-ghost" id="shareBtn">Share</button>
      <button class="btn btn-ghost" id="retakeBtn">Retake</button>
    </div>
  </div>

  <p class="footer-note">Photos never leave your device. <a href="admin.html">LOGIN</a></p>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
